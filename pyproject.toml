[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "latte-cli"
version = "0.1.0"
description = "LaTeX Template To Editor -- rychlé zakládání LaTeXových projektů"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "David Weber" }]
keywords = ["latex", "template", "scaffold", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["tomli>=1.1.0; python_version < '3.11'"]

[project.scripts]
latte = "latte.cli:main"

[project.urls]
Homepage = "https://github.com/D4vEOFF/Py-Latte"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latte = ["templates/**/*"]
